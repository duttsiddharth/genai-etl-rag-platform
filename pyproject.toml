[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
# Vercel's Python framework auto-detection doesn't see app/main.py (the
# thin re-export shim used by the legacy vercel.json `functions` build)
# as a real entrypoint, since it only imports `app` rather than defining
# it. Declaring the entrypoint explicitly here points detection straight
# at the real FastAPI instance in src/api/main.py.
entrypoint = "src.api.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
