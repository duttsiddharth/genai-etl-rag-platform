[project]
# Required by Vercel's uv-based Python build: without a [project] table
# here, `uv lock` has no dependency list to resolve and the build fails
# with "No `project` table found in pyproject.toml". This mirrors
# requirements.txt's core runtime deps only (no pytest/dev extras -
# Vercel's build should stay minimal per its own bundle-size guidance).
name = "documind-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "pypdf==4.3.1",
    "beautifulsoup4==4.12.3",
    "prometheus-client==0.20.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
# Vercel's Python auto-detection only scans app.py/index.py/server.py/
# main.py/wsgi.py/asgi.py at the repo root or directly under src/ or
# app/ - it never looks two levels deep at src/api/main.py, so it can't
# find the FastAPI app on its own. This entrypoint key points straight
# at it (module:variable form); vercel.json's functions key must match
# this same "src/api/main.py" path.
entrypoint = "src.api.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
