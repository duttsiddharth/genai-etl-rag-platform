apiVersion: v1
kind: ConfigMap
metadata:
  name: documind-config
  labels:
    app: documind-api
data:
  EMBEDDING_PROVIDER: "local-hashing"
  VECTOR_STORE: "numpy"
  LLM_PROVIDER: "stub"
  CLOUD_PROVIDER: "aws"
  HYBRID_ALPHA: "0.6"
  AGENT_MAX_STEPS: "6"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "documind-ai-raw-docs"
---
apiVersion: v1
kind: Secret
metadata:
  name: documind-secrets
  labels:
    app: documind-api
type: Opaque
stringData:
  # Placeholder values — replace via your secret manager / sealed-secrets /
  # external-secrets pipeline before applying to a real cluster. Never
  # commit real values here.
  API_KEY: "REPLACE_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
