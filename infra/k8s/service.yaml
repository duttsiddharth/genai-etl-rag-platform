apiVersion: v1
kind: Service
metadata:
  name: documind-api
  labels:
    app: documind-api
spec:
  type: ClusterIP
  selector:
    app: documind-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documind-api-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
spec:
  rules:
    - host: documind.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: documind-api
                port:
                  number: 80
