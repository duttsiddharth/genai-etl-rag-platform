name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit + integration tests
        run: pytest --cov=src --cov-report=term-missing tests/unit tests/integration

      - name: Evaluation harness (non-blocking quality report)
        run: pytest tests/evaluation -v
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t documind-api:${{ github.sha }} -f infra/docker/Dockerfile .

      - name: Terraform format check
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive || true

      # Registry push is gated to main and requires repository secrets
      # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / ECR repo URL) that are
      # not configured in this reference repository.
      - name: Push image to ECR
        if: github.ref == 'refs/heads/main'
        run: echo "Would push documind-api:${{ github.sha }} to ECR here (registry credentials required)."

  deploy:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          echo "Would run: kubectl apply -f infra/k8s/configmap.yaml"
          echo "Would run: kubectl apply -f infra/k8s/deployment.yaml"
          echo "Would run: kubectl apply -f infra/k8s/service.yaml"
          echo "Would run: kubectl apply -f infra/k8s/hpa.yaml"
          echo "Would run: kubectl rollout status deployment/documind-api"
