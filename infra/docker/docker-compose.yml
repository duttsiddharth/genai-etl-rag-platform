# Local development stack.
# Persona: MLOps/DevOps Engineer.
# Usage: docker compose -f infra/docker/docker-compose.yml up --build
version: "3.9"

services:
  documind-api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    image: documind-api:local
    ports:
      - "8000:8000"
    environment:
      - API_KEY=demo-local-key
      - EMBEDDING_PROVIDER=local-hashing
      - VECTOR_STORE=numpy
      - LLM_PROVIDER=stub
      - CLOUD_PROVIDER=local
      - HYBRID_ALPHA=0.6
      - AGENT_MAX_STEPS=6
    volumes:
      - documind_data:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  documind_data:
